name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Configure Git
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace 'inderjeet' below with your Hugging Face username
          # Replace 'SyncScribe' below with your Space name (must match what you created)
          git remote add hf https://inderjeet:${HF_TOKEN}@huggingface.co/spaces/inderjeet/SyncScribe
          git push hf main --force
